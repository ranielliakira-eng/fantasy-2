<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cena 2 - O Alerta</title>
<style>
  body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  canvas { max-width: 100%; max-height: 100%; object-fit: contain; background: #1a1a2e; image-rendering: pixelated; }
</style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="450"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// ==================================================
// CONFIGURAÇÕES DE ZOOM E CÂMERA
// ==================================================
const zoomConfig = {
    scale: 1.3,
    offsetX: -80,
    offsetY: -50
};

let gameState = "dialogue"; 
let fadeAlpha = 0;
let dialogueIndex = 0;
const gravity = 0.8;

// ==================================================
// CONFIGURAÇÃO DE SPRITES (Ajuste os números se necessário)
// ==================================================
const configSprites = {
    'Knight': { idle: 6 },
    'Swordsman': { idle: 8 },
    'Wizard': { idle: 6 },
    'Enchantress': { idle: 5 },
    'Musketeer': { run: 8, dead: 4 }
};

// ==================================================
// DIÁLOGOS
// ==================================================
const sceneDialogue = [
    { speaker: "Wizard", text: "A magia ainda não se estabilizou… algo permanece ecoando." },
    { speaker: "Enchantress", text: "Mas por agora, o mundo respira.", action: "trigger_musketeer" },
    { speaker: "Musketeer", text: "O… Reino humano… foi atacado…" },
    { speaker: "Musketeer", text: "Por criaturas… há muito tempo esquecidas." },
    { speaker: "Wizard", text: "Esquecidas… ou seladas?" }
];

// ==================================================
// ENTIDADES E SPRITES
// ==================================================
function createSprite(src, frameCount, frameSpeed, loop = true) {
    const img = new Image();
    img.src = src;
    return { img, frameCount, frameSpeed, frameIndex: 0, timer: 0, loop, finished: false };
}

const mesaImg = new Image();
mesaImg.src = '../assets/Battleground/Environment/mesa.png'; 

const fundoImg = new Image();
fundoImg.src = '../assets/Battleground/Battleground1/Background.png'; 

const groundImg = new Image();
groundImg.src = '../assets/Battleground/Platformer/Ground_02.png'; 

const escolhaMenu = localStorage.getItem('heroi_da_jornada') || 'loiro'; 
const heroiPadrao = (escolhaMenu === 'castanha') ? 'Knight' : 'Swordsman';

const player = { x: 200, y: 200, w: 100, h: 100, vy: 0, facing: "right", 
    sprite: createSprite(`../assets/${heroiPadrao}/Idle.png`, configSprites[heroiPadrao].idle, 12) };

const wizard = { x: 275, y: 200, w: 100, h: 100, vy: 0, facing: "right", 
    sprite: createSprite("../assets/Wizard/Idle.png", configSprites['Wizard'].idle, 14) };

const enchantress = { x: 350, y: 200, w: 100, h: 100, vy: 0, facing: "right", 
    sprite: createSprite("../assets/Enchantress/Idle.png", configSprites['Enchantress'].idle, 12) };

const musketeer = { 
    x: 900, y: 200, w: 100, h: 100, vy: 0, 
    facing: "left", 
    active: false, 
    hasFallen: false,
    sprite: createSprite("../assets/Musketeer/Run.png", configSprites['Musketeer'].run, 8) 
};

const entities = [player, wizard, enchantress, musketeer];

// ==================================================
// LÓGICA DE UPDATE
// ==================================================
function update() {
    entities.forEach(e => {
        const s = e.sprite;
        if (!s.finished) {
            s.timer++;
            if (s.timer >= s.frameSpeed) {
                s.timer = 0;
                s.frameIndex++;
                
                if (s.frameIndex >= s.frameCount) {
                    if (s.loop) {
                        s.frameIndex = 0;
                    } else {
                        s.frameIndex = s.frameCount - 1;
                        s.finished = true;
                    }
                }
            }
        }
        // Gravidade
        e.vy += gravity;
        e.y += e.vy;
        if (e.y + e.h > 270) { e.y = 270 - e.h; e.vy = 0; }
    });

    if (musketeer.active && !musketeer.hasFallen) {
        if (musketeer.x > 520) {
            musketeer.x -= 8;
        } else {
            musketeer.hasFallen = true;
            musketeer.sprite = createSprite("../assets/Musketeer/Dead.png", configSprites['Musketeer'].dead, 10, false); 
            setTimeout(() => { 
                dialogueIndex++; 
                gameState = "dialogue";
            }, 800);
        }
    }

    if (gameState === "fadeOut") {
        fadeAlpha += 0.01;
        if (fadeAlpha >= 1) window.location.href = "Cena3.html";
    }
}

// ==================================================
// RENDERIZAÇÃO
// ==================================================
function drawEntity(e) {
    if (e === musketeer && !e.active) return;
    if (!e.sprite.img.complete) return;

    const fw = e.sprite.img.width / e.sprite.frameCount;
    const fh = e.sprite.img.height;
    
    ctx.save();
    if (e.facing === "left") {
        ctx.translate(e.x + e.w, e.y);
        ctx.scale(-1, 1);
        ctx.drawImage(e.sprite.img, Math.floor(fw * e.sprite.frameIndex), 0, fw, fh, 0, 0, e.w, e.h);
    } else {
        ctx.drawImage(e.sprite.img, Math.floor(fw * e.sprite.frameIndex), 0, fw, fh, e.x, e.y, e.w, e.h);
    }
    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    ctx.save();
    ctx.imageSmoothingEnabled = false; // Mantém a pixel art nítida
    
    // Aplicação do Zoom e Câmera
    ctx.translate(zoomConfig.offsetX, zoomConfig.offsetY);
    ctx.scale(zoomConfig.scale, zoomConfig.scale);

    // Fundo e Chão
    ctx.fillStyle = "#1a1a2e";
    ctx.fillRect(-200, -200, canvas.width + 400, canvas.height + 400);
    ctx.drawImage(fundoImg, 0, 0, 800, 450);
    
    ctx.fillStyle = "#16213e";
    ctx.fillRect(-200, 270, canvas.width + 400, 100);
    ctx.drawImage(groundImg, 0, 270, 800, 150);

    // Mesa
    ctx.drawImage(mesaImg, 280, 245, 100, 25);

    // Entidades
    entities.forEach(drawEntity);

    ctx.restore(); 

    // UI - Diálogos (Sem Zoom)
    if (gameState === "dialogue" || gameState === "event") {
        const d = sceneDialogue[dialogueIndex];
        if (d && gameState !== "event") {
            ctx.fillStyle = "rgba(0,0,0,0.85)";
            ctx.fillRect(50, 320, 700, 100);
            ctx.strokeStyle = "#4ecca3";
            ctx.lineWidth = 2;
            ctx.strokeRect(55, 325, 690, 90);
            
            ctx.fillStyle = "#4ecca3";
            ctx.font = "bold 20px Georgia";
            ctx.fillText(d.speaker + ":", 80, 355);
            ctx.fillStyle = "#fff";
            ctx.font = "18px Arial";
            ctx.fillText(d.text, 80, 390);
        }
    }

    if (gameState === "fadeOut") {
        ctx.fillStyle = `rgba(0,0,0,${fadeAlpha})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
}

function nextDialogue() {
    if (gameState === "event" || gameState === "fadeOut") return;
    const current = sceneDialogue[dialogueIndex];
    
    if (current && current.action === "trigger_musketeer") {
        gameState = "event";
        musketeer.active = true;
    } else {
        dialogueIndex++;
    }
    
    if (dialogueIndex >= sceneDialogue.length) gameState = "fadeOut";
}

window.addEventListener("keydown", e => { if (e.key === "Enter") nextDialogue(); });
canvas.addEventListener("touchstart", nextDialogue);

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
