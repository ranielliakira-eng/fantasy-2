<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cena 1 - A Coroação</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { max-width: 100%; max-height: 100%; object-fit: contain; background: #432; /* Tom terroso para caverna */ }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="450"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// --- CONFIGURAÇÕES DE ESTADO ---
let gameState = "dialogue"; 
let fadeAlpha = 0;
let dialogueIndex = 0;

// --- DIÁLOGOS DA CENA 1 ---
const scene1Dialogue = [
    { speaker: "Líder Anão do Clã Vermelho", text: "Hoje coroamos o Líder do clã Amarelo o novo rei!" },
    { speaker: "Novo Rei Anão", text: "Meus amigos, irmãos e irmãs das montanhas," },
    { speaker: "Novo Rei Anão", text: "Somos gratos a quem vingou o rei anterior." },
    { speaker: "Novo Rei Anão", text: "Saibam que os anões estão em dívida." },
    { speaker: "Novo Rei Anão", text: "Prometo defender cada pedra, cada mina e cada lar do nosso povo." },
    { speaker: "Novo Rei Anão", text: "Que nossas forjas nunca esfriem, que nossos martelos nunca caiam," },
    { speaker: "Novo Rei Anão", text: "e que nossa coragem brilhe mais que o ouro das cavernas!" },
    { speaker: "Novo Rei Anão", text: "Juntos, Anões!" },
    { speaker: "Anões", text: "*Gritos de celebração e martelos batendo no chão!*" }
];


// --- SPRITES (Ajuste os caminhos conforme sua pasta) ---
function createSprite(src, frameCount, frameSpeed) {
    const img = new Image();
    img.src = src;
    return { img, frameCount, frameSpeed, frameIndex: 0, timer: 0 };
}

// Lógica de Herói (Mantendo sua lógica de seleção)
const escolhaMenu = localStorage.getItem('heroi_da_jornada') || 'loiro'; 
const heroiPadrao = (escolhaMenu === 'castanha') ? 'Knight' : 'Swordsman';
const framesIdle = (heroiPadrao === 'Knight') ? 6 : 8;

// O herói olhando para a esquerda (para encarar os anões)
const player = { 
    x: 400, y: 200, w: 100, h: 100, 
    facing: "left", 
    sprite: createSprite(`../assets/${heroiPadrao}/Idle.png`, framesIdle, 12) 
};

// O Rei olhando para a direita (para encarar o herói)
const reiAnao = { 
    x: 350, y: 130, w: 100, h: 100, 
    facing: "right", 
    sprite: createSprite("../assets/Warrior_3/Idle.png", 5, 14) 
};

const anaoAnciao = { 
    x: 300, y: 130, w: 100, h: 100, 
    facing: "right", 
    sprite: createSprite("../assets/Warrior_2/Idle.png", 5, 10) 
};

const Warrior_1 = { 
    x: 250, y: 200, w: 100, h: 100, 
    facing: "right", 
    sprite: createSprite("../assets/Warrior_1/Idle.png", 6, 10) 
};

const Warrior_1_1 = { 
    x: 300, y: 200, w: 100, h: 100, 
    facing: "right", 
    sprite: createSprite("../assets/Warrior_1/Idle.png", 6, 10) 
};

const Warrior_1_2 = { 
    x: 350, y: 200, w: 100, h: 100, 
    facing: "left", 
    sprite: createSprite("../assets/Warrior_1/Idle.png", 6, 10) 
};

const Warrior_1_3 = { 
    x: 450, y: 200, w: 100, h: 100, 
    facing: "left", 
    sprite: createSprite("../assets/Warrior_1/Idle.png", 6, 10) 
};

const Warrior_2 = { 
    x: 100, y: 200, w: 100, h: 100, 
    facing: "right", 
    sprite: createSprite("../assets/Warrior_2/Idle.png", 5, 10) 
};

const Warrior_2_1 = { 
    x: 150, y: 200, w: 100, h: 100, 
    facing: "right", 
    sprite: createSprite("../assets/Warrior_2/Idle.png", 5, 10) 
};

const Warrior_2_2 = { 
    x: 200, y: 200, w: 100, h: 100, 
    facing: "right", 
    sprite: createSprite("../assets/Warrior_2/Idle.png", 5, 10) 
};

const Warrior_3 = { 
    x: 500, y: 200, w: 100, h: 100, 
    facing: "left", 
    sprite: createSprite("../assets/Warrior_3/Idle.png", 5, 10) 
};

const Warrior_3_1 = { 
    x: 550, y: 200, w: 100, h: 100, 
    facing: "left", 
    sprite: createSprite("../assets/Warrior_3/Idle.png", 5, 10) 
};

const Warrior_3_2 = { 
    x: 600, y: 200, w: 100, h: 100, 
    facing: "left", 
    sprite: createSprite("../assets/Warrior_3/Idle.png", 5, 10) 
};

// --- OBJETOS DO CENÁRIO ---
const fundoImg = new Image();
fundoImg.src = "../assets/Battleground/Battleground1/fundo.png"; 
const groundImg = new Image();
groundImg.src = "../assets/Battleground/Battleground1/Ground1.png";

const shieldImg = new Image();
shieldImg.src = "../assets/Battleground/Environment/Shield2.png";

const stallImg = new Image();
stallImg.src = "../assets/Battleground/Environment/Stall_01.png"; 

const cenarioObjetos = [
    { img: fundoImg, x: -4000, y: -1500, w: 7000, h: 2000},
    { img: groundImg, x: 0, y: 300, w: 800, h: 150 },
    { img: stallImg, x: 300, y: 150, w: 200, h: 150 },
    { img: shieldImg, x: 50, y: 150, w: 50, h: 50 },
    { img: shieldImg, x: 150, y: 150, w: 50, h: 50 },
    { img: shieldImg, x: 250, y: 150, w: 50, h: 50 },
    { img: shieldImg, x: 500, y: 150, w: 50, h: 50 },
    { img: shieldImg, x: 600, y: 150, w: 50, h: 50 },
    { img: shieldImg, x: 700, y: 150, w: 50, h: 50 },

];

function drawEnvironment() {
    cenarioObjetos.forEach(obj => {
        if (obj.img.complete) {
            ctx.drawImage(obj.img, obj.x, obj.y, obj.w, obj.h);
        }
    });
}

// --- LOOP PRINCIPAL ---
function update() {
    [player, reiAnao, anaoAnciao, Warrior_2, Warrior_2_1, Warrior_2_2, Warrior_1,Warrior_1_1, Warrior_1_2, Warrior_1_3, Warrior_3, Warrior_3_1, Warrior_3_2].forEach(e => {
        e.sprite.timer++;
        if (e.sprite.timer >= e.sprite.frameSpeed) {
            e.sprite.timer = 0;
            e.sprite.frameIndex = (e.sprite.frameIndex + 1) % e.sprite.frameCount;
        }
    });

    if (gameState === "fadeOut") {
        fadeAlpha += 0.005;
        if (fadeAlpha >= 1.5) {
            // Aqui você decide o destino: Próximo HTML ou Tela de Texto
            sessionStorage.setItem("cutscene_text", "Enquanto os anões celebravam... o mundo não descansava.");
            window.location.href = "Cena2.html"; 
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Fundo (Simulando interior da montanha)
    ctx.fillStyle = "#221a10";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Chão
    ctx.fillStyle = "#332211";
    ctx.fillRect(0, 300, canvas.width, 70);

    drawEnvironment();

    // Desenhar personagens
    drawSprite(player);
    drawSprite(reiAnao);
    drawSprite(anaoAnciao);
    drawSprite(Warrior_1);
    drawSprite(Warrior_1_1);
    drawSprite(Warrior_1_2);
    drawSprite(Warrior_1_3);
    drawSprite(Warrior_2);
    drawSprite(Warrior_2_1);
    drawSprite(Warrior_2_2);
    drawSprite(Warrior_3);
    drawSprite(Warrior_3_1);
    drawSprite(Warrior_3_2);

    if (gameState === "dialogue") {
        const d = scene1Dialogue[dialogueIndex];
        ctx.fillStyle = "rgba(0,0,0,0.8)";
        ctx.fillRect(40, 320, 720, 100);
        ctx.fillStyle = "#ffd700"; // Cor dourada para nomes
        ctx.font = "bold 20px Arial";
        ctx.fillText(d.speaker + ":", 60, 350);
        ctx.fillStyle = "#fff";
        ctx.font = "18px Arial";
        ctx.fillText(d.text, 60, 385);
    }

    if (gameState === "fadeOut") {
        ctx.fillStyle = `rgba(0,0,0,${fadeAlpha})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Texto de transição no meio do fade
        if (fadeAlpha > 0.5) {
            ctx.fillStyle = `rgba(255,255,255,${fadeAlpha})`;
            ctx.textAlign = "center";
            ctx.font = "22px Georgia";
            ctx.fillText("Enquanto os anões celebravam…", canvas.width/2, canvas.height/2 - 20);
            ctx.fillText("o mundo não descansava.", canvas.width/2, canvas.height/2 + 20);
        }
    }
}

function drawSprite(e) {
    if (!e.sprite.img.complete) return;
    
    const fw = e.sprite.img.width / e.sprite.frameCount;
    
    ctx.save(); // Salva o estado atual do canvas (posição 0,0 sem espelho)

    if (e.facing === "left") {
        // Para virar à esquerda:
        // 1. Move o ponto de origem para a posição do personagem + sua largura
        ctx.translate(e.x + e.w, e.y);
        // 2. Inverte o eixo X
        ctx.scale(-1, 1);
        // 3. Desenha na posição 0,0 (pois o translate já cuidou da posição)
        ctx.drawImage(e.sprite.img, fw * e.sprite.frameIndex, 0, fw, e.sprite.img.height, 0, 0, e.w, e.h);
    } else {
        // Desenho normal para a direita
        ctx.drawImage(e.sprite.img, fw * e.sprite.frameIndex, 0, fw, e.sprite.img.height, e.x, e.y, e.w, e.h);
    }

    ctx.restore(); // Restaura o canvas para o estado normal para o próximo desenho
}

function nextDialogue() {
    dialogueIndex++;
    if (dialogueIndex >= scene1Dialogue.length) {
        gameState = "fadeOut";
    }
}

window.addEventListener("keydown", e => { if (e.key === "Enter" && gameState === "dialogue") nextDialogue(); });
canvas.addEventListener("touchstart", () => { if (gameState === "dialogue") nextDialogue(); });

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
